# Cali Quake Relief System - City Rules and Constants
# Single source of truth for sectors, Engineer damage, UDGR habitability, insurance, and triage.

trafficLights:
  green:
    label: Green - Safe
    meaning: Safe for use or standard aid
    action: Stay calm and follow official city updates
    rank: 1
  yellow:
    label: Yellow - At Risk
    meaning: Restricted use or needs priority check
    action: Limit access and prepare technical support
    rank: 2
  red:
    label: Red - Uninhabitable or Urgent
    meaning: Dangerous building or immediate rescue needed
    action: Evacuate immediately or dispatch emergency team
    rank: 3

sectors:
  economy:
    label: Economy
    description: Shops, hotels, and local business hubs
    alert: Commercial stores and hotels near the epicenter report structural impact
  health:
    label: Health
    description: Hospitals, clinics, and emergency rooms
    alert: Emergency rooms and clinics report heavy patient saturation
  infrastructure:
    label: Infrastructure
    description: Perimeter neighborhood roads, bridges, and utilities
    alert: Neighborhood perimeter road works prioritized over main avenues
  education:
    label: Education
    description: Schools, classrooms, and student safety
    alert: Schools moved to virtual classes after classroom block damage
  logistics:
    label: Logistics
    description: Construction supplies, food, and water trucks
    alert: Construction material supply shortage slowing city rebuilding
  housing:
    label: Housing
    description: Family homes, apartments, and shelters
    alert: UDGR and insurers evaluating damaged homes and uninsured risk

propertyTypes:
  residential:
    label: Residential
  commercial:
    label: Commercial

occupantRoles:
  owner:
    label: Owner
  tenant:
    label: Tenant

inspectorRoles:
  civilEngineer:
    label: Civil Engineer
  architect:
    label: Architect
  topographer:
    label: Topographer
  udgrOfficer:
    label: UDGR Officer

damageLevels:
  superficial:
    label: Superficial Damage
    summary: Surface cracks or cosmetic wear without structural failure
  chronic:
    label: Chronic Damage
    summary: Pre-existing wear worsened by the earthquake tremor
  structural:
    label: Structural Damage
    summary: Core columns, beams, or load-bearing walls compromised

habitabilityStatuses:
  safe:
    label: Safe for Use
    trafficLight: green
    isHabitable: true
    needsEvacuation: false
    guidance: UDGR cleared this building for normal occupancy
  atRisk:
    label: At Risk
    trafficLight: yellow
    isHabitable: false
    needsEvacuation: false
    guidance: Restricted entry until technical repair work is verified
  uninhabitable:
    label: Uninhabitable
    trafficLight: red
    isHabitable: false
    needsEvacuation: true
    guidance: Evacuate immediately and keep building closed

insuranceStatuses:
  insured:
    label: Insured
    claimRoute: Direct Insurance Payout
    responsibleAgency: Private Insurer (Common or Own Policy)
    isHighFinancialRisk: false
    nextStep: Submit reconciled Engineer and UDGR report for direct insurance payout
  mortgage:
    label: Mortgage
    claimRoute: Bank Mortgage Disaster Policy
    responsibleAgency: Lender Bank (Primary Beneficiary)
    isHighFinancialRisk: false
    nextStep: Bank collects structural insurance payout so mortgage debt stays covered
  leasing:
    label: Leasing
    claimRoute: Bank Leasing Structural Policy
    responsibleAgency: Bank Leasing Owner
    isHighFinancialRisk: false
    nextStep: Bank activates leasing structural coverage while ownership transfer pauses
  uninsured:
    label: Uninsured
    claimRoute: UDGR Emergency Relief Subsidy
    responsibleAgency: UDGR Cali Relief Fund
    isHighFinancialRisk: true
    nextStep: HIGH FINANCIAL RISK - Route uninsured household to UDGR shelter and aid grant

ageBrackets:
  underTen:
    label: Child Under 10
    ruleTag: "<10"
    minAge: 0
    maxAge: 9
    score: 3
  youth:
    label: Youth Over 10
    ruleTag: ">10"
    minAge: 10
    maxAge: 17
    score: 1
  adult:
    label: Adult 18 to 59
    ruleTag: ">=18"
    minAge: 18
    maxAge: 59
    score: 0
  senior:
    label: Senior 60 and Over
    ruleTag: ">=60"
    minAge: 60
    maxAge: 120
    score: 3

vulnerabilityFlags:
  hasDisability:
    label: Disability (Wheelchair / Blind)
    score: 3
  isVulnerable:
    label: Vulnerable (Displaced / Violence Victim)
    score: 2
  hasSpecialNeeds:
    label: Special Needs (Ambulance Only)
    score: 3

populationGroups:
  civilian:
    label: Civilian
    protocol: Municipal Shelter and Medical Care
    authority: UDGR and Local Health Network
    score: 0
  military:
    label: Military
    protocol: Joint Defense Medical and Base Relief
    authority: Military Joint Command
    score: 0
  prison:
    label: Prison
    protocol: Secure Evacuation and Guarded Care
    authority: Penitentiary Authority
    score: 1

triageThresholds:
  red:
    minScore: 3
  yellow:
    minScore: 1
  green:
    minScore: 0

limits:
  minAge: 0
  maxAge: 120
